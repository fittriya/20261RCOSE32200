<!DOCTYPE html>
<html>
<head>
    <title>RAID Mapping Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>RAID Mapping Simulator</h1>

    <div class="container">
        <label>RAID Level</label>
        <select id="raidLevel">
            <option value="0">RAID 0</option>
            <option value="1">RAID 1</option>
            <option value="4">RAID 4</option>
            <option value="5">RAID 5</option>
        </select>

        <label>Number of Disks</label>
        <input type="number" id="numDisks" value="4">

        <label>Block Number</label>
        <input type="number" id="blockNumber">

        <button onclick="calculateRaid()">Calculate</button>

        <h2>Result</h2>
        <p id="result">Enter values and click Calculate.</p>
    </div>

    <script src="script.js"></script>

</body>
</html>
