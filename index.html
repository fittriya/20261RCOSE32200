<!DOCTYPE html>
<html>
<head>
    <title>RAID MAPPING SIMULATOR</title>

    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: white;
            font-family: Consolas, Monaco, monospace;
            font-size: 60px;
            font-weight: bold;
            margin: 40px 0;
        }

        .container {
            width: 80%;
            max-width: 850px;
            margin: auto;
            background-color: #1b1b1b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(164, 0, 32, 0.15);
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            height: 55px;
            padding: 0 15px;
            margin-bottom: 18px;
            font-size: 18px;
            color: white;
            background-color: #252525;
            border: 1px solid #a40020;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            height: 60px;
            margin-top: 5px;
            background-color: #a40020;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0002b;
        }

        h2 {
            color: white;
            font-size: 20px;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        #result {
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <h1>RAID Mapping Simulator</h1>

    <div class="container">

        <label for="raidLevel">RAID Level</label>
        <select id="raidLevel">
            <option value="0">RAID 0</option>
            <option value="1">RAID 1</option>
            <option value="4">RAID 4</option>
            <option value="5">RAID 5</option>
        </select>

        <label for="numDisks">Number of Disks</label>
        <input type="number" id="numDisks" value="4">

        <label for="blockNumber">Block Number</label>
        <input type="number" id="blockNumber">

        <button onclick="calculateRaid()">Calculate</button>

        <h2>Result</h2>
        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
